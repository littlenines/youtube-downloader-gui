name: Release

# Pushing a tag such as v1.0.0 builds every package, checks it, and publishes a GitHub release with the files.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version in package.json ($expected)."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Zip the Windows app folder
        shell: pwsh
        run: Compress-Archive -Path release/yt-downloader-win-x64 -DestinationPath release/yt-downloader-win-x64.zip -CompressionLevel Optimal

      - name: Write checksums
        shell: bash
        working-directory: release
        run: sha256sum yt-downloader-win-x64.zip yt-downloader-linux-x64.tar.gz yt-downloader-linux-arm64.tar.gz > SHA256SUMS.txt

      # Lets anyone confirm a file was built by this workflow from this repository: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/yt-downloader-win-x64.zip
            release/yt-downloader-linux-x64.tar.gz
            release/yt-downloader-linux-arm64.tar.gz

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Download

          | System | File | Start it |
          |---|---|---|
          | Windows 10/11 (64-bit) | `yt-downloader-win-x64.zip` | Unzip it, then double-click `yt-downloader.exe` |
          | Linux (64-bit) | `yt-downloader-linux-x64.tar.gz` | `tar xzf yt-downloader-linux-x64.tar.gz && ./yt-downloader/yt-downloader` |
          | Linux ARM64 (e.g. Raspberry Pi 4/5) | `yt-downloader-linux-arm64.tar.gz` | same as above |

          On the first start the app offers to download yt-dlp and ffmpeg (about 75–90 MB).

          Windows may say "Windows protected your PC" because the app isn't code-signed yet: click **More info**, then **Run anyway**.

          `SHA256SUMS.txt` lists the checksums of the files.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "YT Downloader $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            release/yt-downloader-win-x64.zip \
            release/yt-downloader-linux-x64.tar.gz \
            release/yt-downloader-linux-arm64.tar.gz \
            release/SHA256SUMS.txt
