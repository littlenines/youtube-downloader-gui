name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version in package.json ($expected)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write the release notes from CHANGELOG.md
        run: npx tsx scripts/release-notes.ts release-notes.md

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the packages
        run: npm run package

      - name: Zip the Windows app folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/yt-downloader-win-x64 `
            -DestinationPath release/yt-downloader-win-x64.zip `
            -CompressionLevel Optimal

      - name: Write checksums
        shell: bash
        working-directory: release
        run: |
          sha256sum \
            yt-downloader-win-x64.zip \
            yt-downloader-linux-x64.tar.gz \
            yt-downloader-linux-arm64.tar.gz \
            > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/yt-downloader-win-x64.zip
            release/yt-downloader-linux-x64.tar.gz
            release/yt-downloader-linux-arm64.tar.gz

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest_tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
          if [ "$newest_tag" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          gh release create "$GITHUB_REF_NAME" \
            --latest="$latest" \
            --title "YT Downloader $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release/yt-downloader-win-x64.zip \
            release/yt-downloader-linux-x64.tar.gz \
            release/yt-downloader-linux-arm64.tar.gz \
            release/SHA256SUMS.txt
